<header class="site-header">
  <nav id="navbar" class="navbar navbar-light navbar-expand-sm">
    <div class="container">
      <a class="navbar-brand" href="{% if page.permalink == '/' %}#top{% else %}{{ '/' | relative_url }}{% endif %}">Xianping Du</a>
      <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          {% if page.permalink == '/' %}
          <li class="nav-item"><a class="nav-link" href="#research"><span data-lang="en">Research</span><span data-lang="zh" lang="zh-CN">研究方向</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#projects"><span data-lang="en">Projects</span><span data-lang="zh" lang="zh-CN">项目</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#publications"><span data-lang="en">Publications</span><span data-lang="zh" lang="zh-CN">论文</span></a></li>
          <li class="nav-item"><a class="nav-link" href="#contact"><span data-lang="en">Contact</span><span data-lang="zh" lang="zh-CN">联系</span></a></li>
          <li class="nav-item language-switcher-item">
            <label class="sr-only" for="language-switcher">Language / 语言</label>
            <select id="language-switcher" class="language-switcher" aria-label="Language / 语言">
              <option value="en">English</option>
              <option value="zh">中文</option>
            </select>
          </li>
          {% else %}
          <li class="nav-item"><a class="nav-link" href="{{ '/' | relative_url }}">Home</a></li>
          <li class="nav-item {% if page.permalink == '/cv/' %}active{% endif %}"><a class="nav-link" href="{{ '/cv/' | relative_url }}">CV</a></li>
          <li class="nav-item {% if page.permalink == '/publications/' %}active{% endif %}"><a class="nav-link" href="{{ '/publications/' | relative_url }}">Publications</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
</header>
